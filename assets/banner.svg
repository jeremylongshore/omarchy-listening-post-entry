<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Listening Post. A curated AI release radar for your bar.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#06090d"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0.12" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#35c8d6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#35c8d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35c8d6"/>
      <stop offset="1" stop-color="#2b7de0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#sweep)"/>

  <!-- Radar arcs sweeping from behind the pill mocks on the right, low
       opacity, clear of every text baseline. A listening post: it just
       listens, and the ring that lights is where a signal came in. -->
  <g fill="none" opacity="0.5">
    <g stroke="#2b7de0" stroke-width="2" opacity="0.5">
      <circle cx="1112" cy="120" r="60"/>
      <circle cx="1112" cy="120" r="120"/>
      <circle cx="1112" cy="120" r="180"/>
      <circle cx="1112" cy="120" r="240"/>
    </g>
    <!-- the live ring + two blips -->
    <circle cx="1112" cy="120" r="120" stroke="#35c8d6" stroke-width="2.5" opacity="0.9"/>
    <circle cx="1052" cy="196" r="4" fill="#35c8d6" stroke="none">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1004" cy="70" r="3" fill="#e5534b" stroke="none">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Antenna mast, low left, below the feature line's baseline -->
  <g transform="translate(120,300)" fill="none" opacity="0.75" stroke="#2f7d6e">
    <path d="M 0,0 L 0,-46" stroke-width="3"/>
    <path d="M 0,-46 L -18,-20 M 0,-46 L 18,-20" stroke-width="2"/>
    <g stroke="#35c8d6" stroke-width="2" opacity="0.85">
      <path d="M 6,-52 A 12 12 0 0 1 6,-40"/>
      <path d="M 12,-58 A 22 22 0 0 1 12,-34"/>
    </g>
    <circle cx="0" cy="-46" r="3" fill="#35c8d6" stroke="none"/>
  </g>

  <!-- Title block -->
  <text x="72" y="132" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" font-size="66" font-weight="700" letter-spacing="5" fill="#e6edf3">LISTENING POST</text>
  <rect x="76" y="158" width="470" height="4" fill="url(#rule)"/>
  <text x="72" y="204" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" font-size="24" letter-spacing="1" fill="#b0bac6">A curated AI release radar.</text>
  <text x="72" y="238" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" font-size="15" letter-spacing="1" fill="#6b7684">releases · pricing · status incidents · engineering</text>

  <!-- Bar pill mocks, top right -->
  <g transform="translate(812,46)">
    <rect x="0" y="0" width="318" height="46" rx="8" fill="#0d1219" stroke="#223041" stroke-width="1.5"/>
    <text x="16" y="30" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" font-size="17" fill="#e6edf3">AI: 3 new</text>
    <circle cx="298" cy="23" r="5" fill="#35c8d6"/>
  </g>
  <g transform="translate(812,104)">
    <rect x="0" y="0" width="318" height="46" rx="8" fill="#0d1219" stroke="#223041" stroke-width="1.5"/>
    <text x="16" y="30" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" font-size="17" fill="#e5534b">OpenAI incident</text>
    <circle cx="298" cy="23" r="5" fill="#e5534b">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Lane card, bottom right: the widget's identity -->
  <g transform="translate(812,182)">
    <rect x="0" y="0" width="318" height="112" rx="6" fill="#0a0f16" stroke="#223041" stroke-width="1.5"/>
    <g font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',monospace">
      <text x="16" y="28" font-size="12" letter-spacing="2" fill="#5f8fb0">MODEL RELEASES</text>
      <text x="16" y="52" font-size="15" fill="#e6edf3">Claude Code <tspan fill="#35c8d6">v2.1.238</tspan></text>
      <text x="16" y="76" font-size="15" fill="#e6edf3">Anthropic SDK <tspan fill="#35c8d6">v1.0.0</tspan></text>
      <text x="16" y="98" font-size="13" fill="#6b7684">Google DeepMind · Gemini 3.7 Flash</text>
    </g>
  </g>
</svg>
