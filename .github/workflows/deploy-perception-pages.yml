name: Deploy Perception web

on:
  pull_request:
    paths:
      - "web/**"
      - "packages/perception-contract/**"
      - ".github/workflows/deploy-perception-pages.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packages/perception-contract/**"
      - ".github/workflows/deploy-perception-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perception-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_PERCEPTION_API_URL: ${{ vars.PERCEPTION_API_URL }}
          VITE_PERCEPTION_DEMO: ${{ vars.PERCEPTION_DEMO_MODE }}
          VITE_LEMONSQUEEZY_CHECKOUT_URL: ${{ vars.PERCEPTION_CHECKOUT_URL }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
