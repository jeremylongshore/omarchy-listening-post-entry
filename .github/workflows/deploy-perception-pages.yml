name: Build Perception site bundle

on:
  pull_request:
    paths:
      - "web/**"
      - "packages/perception-contract/**"
      - ".github/workflows/deploy-perception-pages.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packages/perception-contract/**"
      - ".github/workflows/deploy-perception-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perception-site-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  production-bundle:
    if: github.event_name != 'pull_request' && vars.PERCEPTION_PRODUCTION_BUNDLE_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:production
        working-directory: web
        env:
          VITE_PERCEPTION_API_URL: ${{ vars.PERCEPTION_API_URL }}
          VITE_PERCEPTION_DEMO: ${{ vars.PERCEPTION_DEMO_MODE }}
          VITE_LEMONSQUEEZY_CHECKOUT_URL: ${{ vars.PERCEPTION_CHECKOUT_URL }}
          VITE_PERCEPTION_PRICE_LABEL: ${{ vars.PERCEPTION_PRICE_LABEL }}
          VITE_PERCEPTION_BILLING_SUMMARY: ${{ vars.PERCEPTION_BILLING_SUMMARY }}
          VITE_PERCEPTION_REFUND_SUMMARY: ${{ vars.PERCEPTION_REFUND_SUMMARY }}
          VITE_PERCEPTION_LEGAL_OPERATOR: IntentSolutions.io LLC
          VITE_PERCEPTION_SUPPORT_EMAIL: support@intentsolutions.io
          VITE_PERCEPTION_TERMS_APPROVED: ${{ vars.PERCEPTION_TERMS_APPROVED }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perception-site-bundle
          path: web/dist
