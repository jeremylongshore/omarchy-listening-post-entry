name: Deploy Perception API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "packages/perception-contract/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-perception-api.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-vps-${{ github.repository }}-perception-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: api
      - run: npm run build && npm test
        working-directory: api
      - run: docker compose config
      - run: docker build -f api/Dockerfile -t perception-api:gate .

  deploy:
    if: vars.PERCEPTION_API_DEPLOY_ENABLED == 'true'
    needs: test
    uses: jeremylongshore/.github/.github/workflows/vps-deploy.yml@53d6be37d6c046818157b954acb33667ac095dd8
    with:
      variant: docker
      srv-path: /srv/perception-src
      health-check-url: https://api.perception.intentsolutions.io/healthz
      vps-tailnet-ip: ${{ vars.PERCEPTION_VPS_TAILNET_IP }}
      vps-public-ip: ${{ vars.PERCEPTION_VPS_PUBLIC_IP }}
      vps-host: intentsolutions
      vps-user: intentsolutions
      smoke-validation: '.status == "ok" and .contractVersion == "1.0"'
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
