services:
  perception-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8790
      DATABASE_PATH: /data/perception.db
      WEB_ORIGIN: https://perception.intentsolutions.io
      API_ORIGIN: https://api.perception.intentsolutions.io
      LOG_LEVEL: info
      LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID:-}
      LEMONSQUEEZY_VARIANT_IDS: ${LEMONSQUEEZY_VARIANT_IDS:-}
      LEMONSQUEEZY_CHECKOUT_URL: ${LEMONSQUEEZY_CHECKOUT_URL:-}
      LEMONSQUEEZY_ALLOW_TEST_MODE: ${LEMONSQUEEZY_ALLOW_TEST_MODE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Perception <perception@intentsolutions.io>}
      INGESTION_ENABLED: ${INGESTION_ENABLED:-true}
      INGESTION_INTERVAL_MS: ${INGESTION_INTERVAL_MS:-900000}
      INGESTION_KEY: ${INGESTION_KEY:-}
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - perception-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  perception-data:
