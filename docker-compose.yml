services:
  perception-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8790
      DATABASE_PATH: /data/perception.db
      WEB_ORIGIN: https://waitstate.intentsolutions.io
      LOG_LEVEL: info
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: https://api.waitstate.intentsolutions.io/v1/auth/github/callback
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - perception-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  perception-data:
